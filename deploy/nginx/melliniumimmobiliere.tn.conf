# nginx on the VPS → the site container (docker-compose.yml publishes it on 127.0.0.1:3000).
#
#   sudo cp deploy/nginx/melliniumimmobiliere.tn.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/melliniumimmobiliere.tn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d melliniumimmobiliere.tn -d www.melliniumimmobiliere.tn --redirect
#
# certbot then adds the `listen 443 ssl` lines and certificates to both blocks below and renews them.

upstream mellinium_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.melliniumimmobiliere.tn;
    return 301 https://melliniumimmobiliere.tn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name melliniumimmobiliere.tn;

    # CRM publications are JSON (photos are fetched by the site, not uploaded): 10 MB is ample.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        proxy_pass http://mellinium_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The site reads the visitor IP from here (contact-form rate limit).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # The CRM's POST/PUT waits while the site downloads every photo (CRM timeout: 120 s).
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Built assets carry a content hash in their name.
    location /assets/ {
        proxy_pass http://mellinium_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
